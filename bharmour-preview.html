<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bharmour Three.js Preview</title>
</head>

<body>
  <main id="bharmour-preview">
    <canvas id="bharmour-preview-canvas"></canvas>

    <section class="preview-intro" aria-live="polite">
      <div class="preview-kicker">Development Preview</div>
      <h1>Bharmour, Himachal Pradesh</h1>
      <p id="preview-viewpoint-description">
        A bounded DEM-derived miniature terrain study.
      </p>
    </section>

    <aside class="preview-controls" aria-label="Preview controls">
      <div class="preview-status" id="preview-status">Loading terrain and assets...</div>

      <section class="preview-diagnostics" aria-label="Terrain diagnostics">
        <div id="preview-terrain-stats">DEM diagnostics loading...</div>
        <div id="preview-camera-position">Camera loading...</div>
        <label>
          <input id="preview-wireframe" type="checkbox" />
          Wireframe
        </label>
        <button id="preview-profile" type="button">Terrain profile</button>
        <button id="preview-scale-toggle" type="button">Scale: overview</button>
        <button id="preview-asset-debug" type="button">Asset test: DEM</button>
        <div id="preview-asset-diagnostics"></div>
      </section>

      <div class="preview-viewpoint-controls">
        <button id="preview-previous" type="button">Previous</button>
        <span id="preview-viewpoint-title">Bharmour Village</span>
        <button id="preview-next" type="button">Next</button>
      </div>

      <div class="preview-dots" id="preview-dots" aria-label="Viewpoints"></div>
    </aside>

    <div class="preview-credit">
      Existing Bharmour coordinates · Technical scene preview only
    </div>
  </main>

  <script type="module" src="/src/bharmour-preview.js"></script>
</body>

</html>
